    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro Bootstrap</title>
</head>
<body>
    
    <div class="container mt-5"> 
        <h1 class="display-4 mb-4">Cadastro</h1> 
        <form action="#" class="row g-3"> 
            <div class="col-md-6">
                <label class="form-label" for="nome">Nome:</label>
                <input type="text" class="form-control" id="nome" placeholder="Seu nome completo">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="email">E-mail:</label>
                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="telefone">Telefone:</label>
                <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="col-12 d-flex justify-content-start mt-4">
                <button type="submit" class="btn btn-success">Enviar Cadastro</button>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
    
    <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
